<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>nbt.de</title>
  <meta name="description" content="nbt.de" />

  <style>
    :root {
      /* Standardfarbe, bis die Tageszeit ermittelt wurde */
      --bg: #6f8896;
      --fg: #ffffff;

      /* Wetteranzeige bewusst etwas dezenter */
      --weather-fg: rgba(255, 255, 255, 0.78);
      --weather-secondary: rgba(255, 255, 255, 0.55);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);

      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      /* Weicher Übergang beim Wechsel der Tageszeit */
      transition: background-color 1.2s ease;
    }

    /*
     * Hintergrundfarben nach Tageszeit
     */

    body.day {
      background-color: #6f8896;
    }

    body.evening {
      background-color: #556b78;
    }

    body.night {
      background-color: #3f5563;
    }

    /*
     * Mittiger Schriftzug
     */

    .logo {
      color: var(--fg);
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1;

      user-select: none;
      -webkit-user-select: none;
    }

    /*
     * Wetteranzeige oben links
     */

    .weather {
      position: fixed;
      top: 24px;
      left: 28px;

      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--weather-fg);
      font-size: clamp(15px, 1.5vw, 20px);
      line-height: 1.2;

      user-select: none;
      -webkit-user-select: none;
    }

    /*
     * Wettersymbol
     */

    .weather-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;

      font-size: 28px;
      line-height: 1;
    }

    /*
     * Temperatur und Wetterzustand
     */

    .weather-main {
      display: flex;
      align-items: baseline;
      gap: 7px;

      font-weight: 400;
      white-space: nowrap;
    }

    .weather-temperature {
      font-weight: 600;
    }

    /*
     * Dezente Fehlermeldung
     */

    .weather-error {
      color: var(--weather-secondary);
      font-size: 14px;
      font-weight: 400;
    }

    /*
     * Anpassung für Smartphones und kleine Tablets
     */

    @media (max-width: 600px) {
      .weather {
        top: 16px;
        left: 16px;
        gap: 8px;
      }

      .weather-icon {
        width: 30px;
        height: 30px;

        font-size: 24px;
      }
    }

    /*
     * Bewegungsreduktion entsprechend der Systemeinstellung
     */

    @media (prefers-reduced-motion: reduce) {
      body {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <!-- Wetteranzeige ohne sichtbare Ortsangabe -->
  <div
    class="weather"
    id="weather"
    role="status"
    aria-live="polite"
    aria-label="Aktuelles Wetter"
  >
    <div
      class="weather-icon"
      id="weatherIcon"
      aria-hidden="true"
    >
      ·
    </div>

    <div class="weather-main">
      <span
        class="weather-temperature"
        id="weatherTemperature"
      >
        Wetter wird geladen
      </span>

      <span id="weatherDescription"></span>
    </div>
  </div>

  <!-- Mittiger Schriftzug -->
  <div class="logo">nbt.de</div>

  <script>
    (function () {
      /*
       * Fester Standort für die Wetterabfrage.
       *
       * Postleitzahl und Ort werden auf der Webseite
       * an keiner Stelle sichtbar ausgegeben.
       */

      const latitude = 50.956;
      const longitude = 13.858;

      const weatherElement =
        document.getElementById("weather");

      const iconElement =
        document.getElementById("weatherIcon");

      const temperatureElement =
        document.getElementById("weatherTemperature");

      const descriptionElement =
        document.getElementById("weatherDescription");

      /*
       * Hintergrund anhand der Ortszeit anpassen.
       *
       * Tag:    07:00 bis 17:59 Uhr
       * Abend:  18:00 bis 21:59 Uhr
       * Nacht:  22:00 bis 06:59 Uhr
       */

      function updateBackgroundByTime() {
        const hour = Number(
          new Intl.DateTimeFormat("de-DE", {
            timeZone: "Europe/Berlin",
            hour: "2-digit",
            hour12: false
          }).format(new Date())
        );

        document.body.classList.remove(
          "day",
          "evening",
          "night"
        );

        if (hour >= 7 && hour < 18) {
          document.body.classList.add("day");
        } else if (hour >= 18 && hour < 22) {
          document.body.classList.add("evening");
        } else {
          document.body.classList.add("night");
        }
      }

      /*
       * WMO-Wettercodes in deutsche Beschreibungen
       * und passende Symbole übersetzen.
       */

      function getWeatherInformation(code, isDay) {
        const day = isDay === 1;

        if (code === 0) {
          return {
            icon: day ? "☀️" : "🌙",
            description: "Klar"
          };
        }

        if (code === 1) {
          return {
            icon: day ? "🌤️" : "🌙",
            description: "Überwiegend klar"
          };
        }

        if (code === 2) {
          return {
            icon: day ? "⛅" : "☁️",
            description: "Teilweise bewölkt"
          };
        }

        if (code === 3) {
          return {
            icon: "☁️",
            description: "Bewölkt"
          };
        }

        if (code === 45 || code === 48) {
          return {
            icon: "🌫️",
            description: "Neblig"
          };
        }

        if (
          code === 51 ||
          code === 53 ||
          code === 55
        ) {
          return {
            icon: "🌦️",
            description: "Nieselregen"
          };
        }

        if (code === 56 || code === 57) {
          return {
            icon: "🌧️",
            description: "Gefrierender Nieselregen"
          };
        }

        if (
          code === 61 ||
          code === 63 ||
          code === 65
        ) {
          return {
            icon: "🌧️",
            description: "Regen"
          };
        }

        if (code === 66 || code === 67) {
          return {
            icon: "🌧️",
            description: "Gefrierender Regen"
          };
        }

        if (
          code === 71 ||
          code === 73 ||
          code === 75
        ) {
          return {
            icon: "🌨️",
            description: "Schneefall"
          };
        }

        if (code === 77) {
          return {
            icon: "🌨️",
            description: "Schneegriesel"
          };
        }

        if (
          code === 80 ||
          code === 81 ||
          code === 82
        ) {
          return {
            icon: "🌦️",
            description: "Regenschauer"
          };
        }

        if (code === 85 || code === 86) {
          return {
            icon: "🌨️",
            description: "Schneeschauer"
          };
        }

        if (code === 95) {
          return {
            icon: "⛈️",
            description: "Gewitter"
          };
        }

        if (code === 96 || code === 99) {
          return {
            icon: "⛈️",
            description: "Gewitter mit Hagel"
          };
        }

        return {
          icon: "🌡️",
          description: "Aktuelles Wetter"
        };
      }

      /*
       * Aktuelles Wetter laden
       */

      async function loadWeather() {
        const apiUrl =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=" + latitude +
          "&longitude=" + longitude +
          "&current=temperature_2m,weather_code,is_day" +
          "&temperature_unit=celsius" +
          "&timezone=Europe%2FBerlin";

        try {
          const response = await fetch(apiUrl);

          if (!response.ok) {
            throw new Error(
              "Wetterdienst antwortet mit Status " +
              response.status
            );
          }

          const data = await response.json();

          if (
            !data.current ||
            typeof data.current.temperature_2m !== "number" ||
            typeof data.current.weather_code !== "number"
          ) {
            throw new Error(
              "Der Wetterdienst hat unvollständige Daten geliefert."
            );
          }

          const temperature =
            Math.round(data.current.temperature_2m);

          const weather =
            getWeatherInformation(
              data.current.weather_code,
              data.current.is_day
            );

          iconElement.textContent = weather.icon;

          temperatureElement.textContent =
            temperature + " °C";

          descriptionElement.textContent =
            weather.description;

          temperatureElement.classList.remove(
            "weather-error"
          );

          /*
           * Auch die barrierefreie Beschreibung nennt
           * bewusst weder Postleitzahl noch Ort.
           */

          weatherElement.setAttribute(
            "aria-label",
            "Aktuelles Wetter: " +
              temperature +
              " Grad Celsius, " +
              weather.description
          );
        } catch (error) {
          console.error(
            "Wetter konnte nicht geladen werden:",
            error
          );

          iconElement.textContent = "◦";

          temperatureElement.textContent =
            "Wetter nicht verfügbar";

          temperatureElement.classList.add(
            "weather-error"
          );

          descriptionElement.textContent = "";

          weatherElement.setAttribute(
            "aria-label",
            "Wetterdaten sind momentan nicht verfügbar"
          );
        }
      }

      /*
       * Hintergrund und Wetter beim Öffnen laden
       */

      updateBackgroundByTime();
      loadWeather();

      /*
       * Hintergrund jede Minute überprüfen.
       */

      window.setInterval(
        updateBackgroundByTime,
        60 * 1000
      );

      /*
       * Wetter alle 15 Minuten aktualisieren.
       */

      window.setInterval(
        loadWeather,
        15 * 60 * 1000
      );
    })();
  </script>
</body>
</html>
